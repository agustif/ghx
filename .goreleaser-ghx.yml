version: 2

project_name: ghx

release:
  github:
    owner: agustif
    name: ghx
  prerelease: auto
  draft: true
  disable: true
  name_template: "ghx {{.Version}}"

builds:
  - id: macos
    goos: [darwin]
    goarch: [amd64, arm64]
    binary: bin/ghx
    main: ./cmd/gh
    ldflags:
      - -s -w -X github.com/cli/cli/v2/internal/build.Name=ghx -X github.com/cli/cli/v2/internal/build.Version={{.Version}} -X github.com/cli/cli/v2/internal/build.Date={{time "2006-01-02"}}

  - id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]
    env:
      - CGO_ENABLED=0
    binary: bin/ghx
    main: ./cmd/gh
    ldflags:
      - -s -w -X github.com/cli/cli/v2/internal/build.Name=ghx -X github.com/cli/cli/v2/internal/build.Version={{.Version}} -X github.com/cli/cli/v2/internal/build.Date={{time "2006-01-02"}}

  - id: windows
    goos: [windows]
    goarch: ["386", amd64, arm64]
    binary: bin/ghx
    main: ./cmd/gh
    ldflags:
      - -s -w -X github.com/cli/cli/v2/internal/build.Name=ghx -X github.com/cli/cli/v2/internal/build.Version={{.Version}} -X github.com/cli/cli/v2/internal/build.Date={{time "2006-01-02"}}

archives:
  - id: linux-archive
    ids: [linux]
    name_template: "ghx_{{ .Version }}_linux_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [tar.gz]
    files:
      - LICENSE
  - id: macos-archive
    ids: [macos]
    name_template: "ghx_{{ .Version }}_macOS_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [zip]
    files:
      - LICENSE
  - id: windows-archive
    ids: [windows]
    name_template: "ghx_{{ .Version }}_windows_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: false
    formats: [zip]
    files:
      - LICENSE
